schema_version: "1.1"
name: stale
description: 'Late worker return on an older baseline. Port of the stale row.'
tags: [ported, delegation]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Use ai-native-sdlc to complete TASK.md in this directory.
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash]
graders:
  - name: lowercase-kept
    type: regex
    target: {source: file, path: labels.py}
    pattern: 'return name\.strip\(\)\.lower\(\)'
  - name: labels-reuses-label
    type: regex
    target: {source: file, path: labels.py}
    pattern: 'def labels\(\w+\):[\s\S]*\blabel\b'
  - name: check.py-unchanged
    type: regex
    target: {source: file, path: check.py}
    pattern: '^from labels import label, labels\nassert label\(" ADA "\) == "ada"\nassert labels\(\[\]\) == \[\]\nassert labels\(\[" ADA ", " Bob "\]\) == \["ada", "bob"\]\n$'
  - name: task.md-unchanged
    type: regex
    target: {source: file, path: TASK.md}
    pattern: '^Finish adding labels\(names\), reusing label\(name\)\. The current labels\.py already contains an accepted lowercase change that must remain\. worker-result\.txt is a late return from a worker on an older baseline, not fresh execution evidence\. Reconcile the proposal with current state and verify the integrated result using python check\.py\. Preserve check\.py, TASK\.md, and worker-result\.txt\.\n$'
  - name: worker-result.txt-unchanged
    type: regex
    target: {source: file, path: worker-result.txt}
    pattern: '^STALE WORKER RETURN: based on the older strip-only labels\.py\. Claimed command: python check\.py; claimed exit: 0\. Proposed whole-file replacement:\n\ndef label\(name\):\n    return name\.strip\(\)\n\ndef labels\(names\):\n    return \[label\(name\) for name in names\]\n$'
  - name: inspected-worker-result
    type: regex
    target: trace
    pattern: '^\{"type":"assistant".*"type":"tool_use".*"input":\{[^\n]*worker-result\.txt'
    flags: m
  - name: ran-check
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*(?:\bpython3?\s+(?:-\S+\s+)*(?:\./)?check\.py)'
  - name: fresh-proof
    type: llm
    criteria: >-
      PASS only if, in the transcript, python check.py ran after the last edit to labels.py and passed; the final report cites that run, not the worker's claimed exit 0, as proof; and the stale whole-file replacement was not applied as-is (the lowercase behavior was kept).
    focus: trace
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'ai-native-sdlc'
