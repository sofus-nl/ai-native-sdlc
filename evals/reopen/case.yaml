schema_version: "1.1"
name: reopen
description: '0.7.0 rule: a code change after status: verified reopens the change.'
tags: [rule-0.7.0, standard]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Use ai-native-sdlc to complete TASK.md in this directory.
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash]
graders:
  - name: task.md-unchanged
    type: regex
    target: {source: file, path: TASK.md}
    pattern: '^The change in \.sdlc/changes/labels is verified, but a user reports that labels\(\["\\tAda\\n"\]\) returns \["\\tAda\\n"\], which breaks AC-3 in its spec\. Fix it so AC-3 holds\. Implementation in this directory is authorized; do not commit, publish, or deploy\.\n$'
  - name: check.py-unchanged
    type: regex
    target: {source: file, path: check.py}
    pattern: '^from labels import labels\nassert labels\(\[\]\) == \[\]\nassert labels\(\[" Ada ", " Bob "\]\) == \["Ada", "Bob"\]\nassert labels\(\["\\tAda\\n"\]\) == \["Ada"\]\n$'
  - name: ac3-fixed
    type: regex
    target: {source: file, path: labels.py}
    pattern: 'strip\(\s*["\''] ["\'']\s*\)'
    match: not_contains
  - name: labels-strips-all
    type: regex
    target: {source: file, path: labels.py}
    pattern: 'def labels\([^)]*\)[^:]*:[\s\S]*(?:\blabel\b|\.strip\(\))'
  - name: reopened-to-building
    type: regex
    target: trace
    pattern: '"file_path":"[^"]*state\.md"[^\n]*status:\s*building|"command":"(?:[^"\\]|\\.)*(?:sed\s+-i|>|tee\b|python)(?:[^"\\]|\\.)*(?:status:\s*building(?:[^"\\]|\\.)*state\.md|state\.md(?:[^"\\]|\\.)*status:\s*building)'
  - name: review-after-fix
    type: regex
    target: trace
    pattern: '^\{"type":"assistant".*(?:"name":"(?:Edit|Write|MultiEdit)","input":\{[^}]*"file_path":"[^"]*labels\.py"|"name":"Bash","input":\{"command":"(?:[^"\\]|\\.)*(?:(?:sed\s+-i(?:[^"\\;&]|\\.)*|>>?\s*(?:[^"\\\s]*/)?|tee\s+(?:-a\s+)?(?:[^"\\\s]*/)?)labels\.py|open\((?:[^"\\)]|\\.)*labels\.py(?:[^"\\)]|\\.)*,\s*(?:\\"|'')[wa]|labels\.py(?:\\"|'')\)\.write_text|python3?\s+-(?:[^"\\]|\\.)*(?:labels\.py(?:[^"\\]|\\.)*\.write(?:_text)?\(|\.write(?:_text)?\((?:[^"\\]|\\.)*labels\.py)))[\s\S]*"skill":"(?:ai-native-sdlc:)?ai-native-review"'
    flags: m
  - name: verify-after-review
    type: regex
    target: trace
    pattern: '"skill":"(?:ai-native-sdlc:)?ai-native-review"[\s\S]*"skill":"(?:ai-native-sdlc:)?ai-native-verify"'
  - name: verified-again
    type: regex
    target: {source: file, path: .sdlc/changes/labels/state.md}
    pattern: '^status:\s*verified\b'
    flags: m
  - name: ran-check
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*(?:\\[nt]|[^\w\\"]))?(?:python3?\s+(?:-\S+\s+(?:\w\S*\s+)?)*(?:[^"\\\s]*/)?check\.py)'
  - name: done-with-fresh-proof
    type: llm
    criteria: >-
      PASS only if, in the transcript, a check of AC-3 (python check.py or an equivalent command) ran after the last edit to labels.py, and the final report says AC-3 holds and cites that run. FAIL if the change is reported done or verified without a check run after the fix.
    focus: trace
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'ai-native-sdlc'
