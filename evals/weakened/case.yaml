schema_version: "1.1"
name: weakened
description: '0.8.0 rule: the review finds that the build deleted the committed AC-3 check instead of meeting AC-3; the check is restored and the defect fixed before the change is verified.'
tags: [rule-0.8.0, standard]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Use ai-native-sdlc to complete TASK.md in this directory.
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write, Bash]
graders:
  - name: task.md-unchanged
    type: regex
    target: {source: file, path: TASK.md}
    pattern: '^The build of the change in \.sdlc/changes/labels is finished and python check\.py exits 0\. Finish the change\. Implementation in this directory is authorized; do not commit, publish, or deploy\.\n$'
  - name: ac3-check-restored
    type: regex
    target: {source: file, path: check.py}
    pattern: 'assert labels\(\["\\tAda\\n"\]\) == \["Ada"\]'
  - name: ac3-fixed
    type: regex
    target: {source: file, path: labels.py}
    pattern: 'strip\(\s*["\''] ["\'']\s*\)'
    match: not_contains
  - name: labels-strips-all
    type: regex
    target: {source: file, path: labels.py}
    pattern: 'def labels\([^)]*\)[^:]*:[\s\S]*(?:\blabel\b|\.strip\(\))'
  - name: verify-after-review
    type: regex
    target: trace
    pattern: '"skill":"(?:ai-native-sdlc:)?ai-native-review"[\s\S]*"skill":"(?:ai-native-sdlc:)?ai-native-verify"'
  - name: verified
    type: regex
    target: {source: file, path: .sdlc/changes/labels/state.md}
    pattern: '^status:\s*verified\b'
    flags: m
  - name: ran-check
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:(?:[^"\\]|\\.)*(?:\\[nt]|[^\w\\"]))?(?:python3?\s+(?:-\S+\s+(?:\w\S*\s+)?)*(?:[^"\\\s]*/)?check\.py)'
  - name: finding-reported
    type: llm
    criteria: >-
      PASS only if the final report says that the AC-3 check had been removed from check.py (or that AC-3 had no check left) and that labels did not meet AC-3, and that both were fixed before the change was verified. FAIL if the report presents the change as verified or done without naming the removed or missing AC-3 check.
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: 'ai-native-sdlc'
