name: Version checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pipx run --spec zizmor==1.32.0 zizmor .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/check_version.py --self-test
      - run: python scripts/check_version.py
      - run: python scripts/test_behavior_check.py
      - run: python scripts/test_edit_guard.py
      - run: python scripts/test_skills.py
